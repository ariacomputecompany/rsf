[package]
name = "rsfd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
sha2 = "0.10"
rsf-auth = { path = "../rsf-auth" }
rsf-tenancy = { path = "../rsf-tenancy" }
rsf-admin = { path = "../rsf-admin" }
rsf-blob = { path = "../rsf-blob" }
rsf-control = { path = "../rsf-control" }
rsf-core = { path = "../rsf-core" }
rsf-kv = { path = "../rsf-kv" }
rsf-object = { path = "../rsf-object" }
rsf-observability = { path = "../rsf-observability" }
rsf-policy = { path = "../rsf-policy" }
rsf-protocol = { path = "../rsf-protocol" }
rsf-sql = { path = "../rsf-sql" }
rsf-upgrade = { path = "../rsf-upgrade" }
rsf-vsr = { path = "../rsf-vsr" }
rsf-wire = { path = "../rsf-wire" }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[[bin]]
name = "rsfd"
path = "src/main.rs"

[lints]
workspace = true
