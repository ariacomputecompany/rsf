name: Host qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Finish the active qualification; keep only the newest pending run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    name: qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.92.0"
      FOZZY_SEED: "20260912"
    steps:
      - name: Check out exact RSF revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 ref
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out reviewed engine source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ariacomputecompany/fozzy
          ref: 30ef888219e3f822301fc6e6fd30644b1177ba9e
          path: artifacts/ci-engine-source
          persist-credentials: false
      - name: Isolate engine from the RSF Cargo workspace
        run: |
          engine_source="$(mktemp -d "$RUNNER_TEMP/rsf-fozzy-source.XXXXXX")/checkout"
          mv artifacts/ci-engine-source "$engine_source"
          echo "ENGINE_SOURCE=$engine_source" >> "$GITHUB_ENV"
      - name: Check bootstrap bookkeeping (fake subprocesses only)
        run: python3 -B scripts/test_bootstrap_fozzy.py
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy
      - name: Build and identify the engine
        run: |
          python3 -B scripts/bootstrap-fozzy.py "$ENGINE_SOURCE" artifacts/ci-engine
          echo "FOZZY_BIN=$GITHUB_WORKSPACE/artifacts/ci-engine/bin/fozzy" >> "$GITHUB_ENV"
      - name: Check verifier bookkeeping (fake engine only)
        run: python3 -B scripts/test_verify_fozzy.py
      - name: Strict workspace Clippy
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee artifacts/ci-clippy.log
      - name: Qualify all 25 domains with fresh host processes
        run: sh scripts/verify-fozzy.sh --artifact-dir artifacts/ci-gate
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4 ref
        with:
          name: qualification-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-engine/
            artifacts/ci-clippy.log
            artifacts/ci-gate/
            .fozzy/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
